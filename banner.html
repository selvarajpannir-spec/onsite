<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f8f9fa;
    overflow: hidden;
  }
  .header {
    color: white;
    font-size: 12px;
    font-weight: 600;
    text-align: center;
    padding: 4px 0;
    letter-spacing: 0.3px;
    transition: background-color 0.4s ease;
  }
  #banner {
    display: flex;
    align-items: center;
    height: 56px;
    padding: 0 12px;
    background: white;
    border-top: 1px solid #e0e0e0;
    cursor: pointer;
  }
  #banner img {
    width: 42px;
    height: 42px;
    border-radius: 8px;
    object-fit: contain;
    object-position: center;
    margin-right: 12px;
    flex-shrink: 0;
    background: #f1f3f4;
  }
  .text {
    flex: 1;
    overflow: hidden;
  }
  .title {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
  }
  .subtitle-container {
    overflow: hidden;
    height: 16px;
    position: relative;
  }
  .subtitle {
    font-size: 12px;
    white-space: nowrap;
    position: absolute;
    animation: marquee 20s linear infinite;
  }
  @keyframes marquee {
    0%   { transform: translateX(100%); }
    100% { transform: translateX(-100%); }
  }
  .cta {
    background: #1a73e8;
    color: white;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 16px;
    margin-left: 8px;
    flex-shrink: 0;
  }
</style>
</head>
<body>

  <div class="header" id="header">Try My Other Apps</div>

  <div id="banner">
    <img id="icon" src="" alt="">
    <div class="text">
      <div class="title" id="title">Loading...</div>
      <div class="subtitle-container">
        <div class="subtitle" id="subtitle"></div>
      </div>
    </div>
    <div class="cta">Get</div>
  </div>

<script>
  // ============================================
  //  EASY TO EXPAND - Just add more objects here
  // ============================================
  const defaultBanners = [
    {
      image: "https://cdn.jsdelivr.net/gh/selvarajpannir-spec/onsite/images/rider.png",
      title: "Rider+",
      subtitle: "Delivery management App for independent parcel delivery and gig workers",
      url: "https://play.google.com/store/apps/details?id=com.riderplus.app"
    },
    {
     
      image: "https://cdn.jsdelivr.net/gh/selvarajpannir-spec/onsite/images/iv-manager.png",
      title: "Inventory Manager+",
      subtitle: "Simple Warehouse Inventory Management App for Small Companies. Features: Low stock alert , One Click To View Current Stocks",
      url: "https://play.google.com/store/apps/details?id=com.inventorymanagerplus.app"
    },
    {
      image: "https://cdn.jsdelivr.net/gh/selvarajpannir-spec/onsite/images/lifting.png",
      title: "Lifting+",
      subtitle: "Lifting Plan Helper App for Lifting Crane operations. Easy to Find Values(Angle and Distance) With Trigonometry Formulas, Easy To Find Weight of Materials",
      url: "https://play.google.com/store/apps/details?id=com.lifting.plus"
    },
    {
      image: "https://cdn.jsdelivr.net/gh/selvarajpannir-spec/onsite/images/salary.png",
      title: "Salary+",
      subtitle: "Time Card Management And Quick Salary, Overtime & Allowance Calculator",
      url: "https://play.google.com/store/apps/details?id=com.salaryplus.app"
    },
    {
      image: "https://cdn.jsdelivr.net/gh/selvarajpannir-spec/onsite/images/docs+.png",
      title: "Docs+",
      subtitle: "Bulk document generator from templates . Easy to Generate 100+ Salary invoice , Certificates for different persons within 5 minutes",
      url: "https://play.google.com/store/apps/details?id=com.docs.plus"
    }
    // ← Add more apps here in the future
  ];

  const colors = [
    "#1a73e8", "#d93025", "#188038", "#f9ab00",
    "#a142f4", "#e37400", "#007b83"
  ];

  let banners = [];
  let current = 0;
  const rotateSeconds = 20; // 6x slower

  // Load from cache or use default
  function loadBanners() {
    const cached = localStorage.getItem("house_banners");
    
    if (navigator.onLine) {
      // Online → use latest list and update cache
      banners = defaultBanners;
      localStorage.setItem("house_banners", JSON.stringify(defaultBanners));
      console.log("Loaded latest banners + updated cache");
    } else if (cached) {
      // Offline → use cache
      banners = JSON.parse(cached);
      console.log("Offline - loaded from cache");
    } else {
      // First time + offline
      banners = defaultBanners;
    }

    if (banners.length > 0) {
      showBanner(0);
      setInterval(() => {
        current = (current + 1) % banners.length;
        showBanner(current);
      }, rotateSeconds * 1000);
    }
  }

  function showBanner(index) {
    const b = banners[index];
    const color = colors[index % colors.length];

    document.getElementById("header").style.backgroundColor = color;
    document.getElementById("icon").src = b.image;
    document.getElementById("title").innerText = b.title;
    document.getElementById("title").style.color = color;

    const subtitle = document.getElementById("subtitle");
    subtitle.innerText = b.subtitle;
    subtitle.style.color = color;

    // Restart marquee
    subtitle.style.animation = "none";
    subtitle.offsetHeight;
    subtitle.style.animation = "marquee 20s linear infinite";

    document.getElementById("banner").onclick = () => {
      if (window.Android && Android.openUrl) {
        Android.openUrl(b.url);
      } else {
        window.location.href = b.url;
      }
    };
  }

  // Also listen for when internet comes back
  window.addEventListener("online", () => {
    console.log("Back online - refreshing banners");
    loadBanners();
  });

  loadBanners();
</script>
</body>
</html>
