<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f8f9fa;
    overflow: hidden;
  }
  #banner {
    display: flex;
    align-items: center;
    height: 60px;                 /* match your old AdMob height */
    padding: 0 12px;
    background: white;
    border-top: 1px solid #e0e0e0;
    cursor: pointer;
  }
  #banner img {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    object-fit: cover;
    margin-right: 12px;
  }
  .text {
    flex: 1;
    overflow: hidden;
  }
  .title {
    font-size: 14px;
    font-weight: 600;
    color: #202124;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .subtitle {
    font-size: 12px;
    color: #5f6368;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cta {
    background: #1a73e8;
    color: white;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 16px;
    margin-left: 8px;
  }
</style>
</head>
<body>
  <div id="banner">
    <img id="icon" src="" alt="">
    <div class="text">
      <div class="title" id="title">Loading...</div>
      <div class="subtitle" id="subtitle"></div>
    </div>
    <div class="cta">Get</div>
  </div>

<script>
  const JSON_URL = "https://raw.githubusercontent.com/YOUR_USERNAME/YOUR_REPO/main/banners.json"; // ← change this
  let banners = [];
  let current = 0;
  let rotateSeconds = 8;

  async function loadBanners() {
    try {
      const res = await fetch(JSON_URL + "?t=" + Date.now());
      const data = await res.json();
      banners = data.banners || [];
      rotateSeconds = data.rotateSeconds || 8;
      if (banners.length > 0) {
        showBanner(0);
        setInterval(() => {
          current = (current + 1) % banners.length;
          showBanner(current);
        }, rotateSeconds * 1000);
      }
    } catch (e) {
      document.getElementById("title").innerText = "Our Apps";
      document.getElementById("subtitle").innerText = "Tap to see more";
    }
  }

  function showBanner(index) {
    const b = banners[index];
    document.getElementById("icon").src = b.image;
    document.getElementById("title").innerText = b.title;
    document.getElementById("subtitle").innerText = b.subtitle;
    document.getElementById("banner").onclick = () => {
      // Open Play Store
      if (window.Android && Android.openUrl) {
        Android.openUrl(b.url);          // if you add JavascriptInterface
      } else {
        window.location.href = b.url;    // fallback
      }
    };
  }

  loadBanners();
</script>
</body>
</html>
