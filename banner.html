<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f8f9fa;
    overflow: hidden;
  }

  .header {
    background: #1a73e8;
    color: white;
    font-size: clamp(11px, 2.8vw, 13px);
    font-weight: 600;
    text-align: center;
    padding: 5px 0;
    transition: background 0.4s;
  }

  #banner {
    display: flex;
    align-items: center;
    height: clamp(52px, 14vw, 64px);
    padding: 0 clamp(8px, 3vw, 14px);
    background: white;
    border-top: 1px solid #e0e0e0;
  }

  #banner img {
    width: clamp(36px, 10vw, 48px);
    height: clamp(36px, 10vw, 48px);
    border-radius: 8px;
    object-fit: contain;
    margin-right: clamp(8px, 2.5vw, 12px);
    background: #f1f3f4;
    flex-shrink: 0;
  }

  .text {
    flex: 1;
    overflow: hidden;
    min-width: 0;
  }

  .title {
    font-size: clamp(13px, 3.5vw, 15px);
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
  }

  .subtitle {
    font-size: clamp(11px, 3vw, 13px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cta {
    background: #1a73e8;
    color: white;
    font-size: clamp(11px, 3vw, 13px);
    font-weight: 500;
    padding: clamp(5px, 1.5vw, 7px) clamp(10px, 3vw, 14px);
    border-radius: 16px;
    text-decoration: none;
    flex-shrink: 0;
    white-space: nowrap;
  }

  /* Extra adjustment for very small screens */
  @media (max-width: 360px) {
    #banner {
      height: 50px;
    }
    .title {
      font-size: 12.5px;
    }
    .subtitle {
      font-size: 10.5px;
    }
  }

  /* Better look on tablets and larger screens */
  @media (min-width: 600px) {
    #banner {
      height: 62px;
      padding: 0 16px;
    }
    #banner img {
      width: 48px;
      height: 48px;
    }
  }
</style>
</head>
<body>

  <div class="header" id="header">Try My Other Apps</div>

  <div id="banner">
    <img id="icon" src="" alt="">
    <div class="text">
      <div class="title" id="title"></div>
      <div class="subtitle" id="subtitle"></div>
    </div>
    <a class="cta" id="cta" href="#" target="_blank">Get</a>
  </div>

<script>
  const apps = [
    {
      title: "Rider+",
      image: "https://cdn.jsdelivr.net/gh/selvarajpannir-spec/onsite@main/images/rider.png",
      url: "https://play.google.com/store/apps/details?id=com.riderplus.app",
      sentences: [
        "Useful for gig & parcel delivery workers",
        "Manage all your deliveries in one app",
        "Track earnings and daily performance",
        "Fast, lightweight and free to use"
      ]
    },
    {
      title: "Inventory Manager+",
      image: "https://cdn.jsdelivr.net/gh/selvarajpannir-spec/onsite@main/images/iv-manager.png",
      url: "https://play.google.com/store/apps/details?id=com.inventorymanagerplus.app",
      sentences: [
        "Simple mobile ledger for warehouse stocks",
        "Track goods movement in and out easily",
        "Low stock alerts help you stay prepared",
        "Perfect for small companies and SMEs"
      ]
    },
    {
      title: "Lifting+",
      image: "https://cdn.jsdelivr.net/gh/selvarajpannir-spec/onsite@main/images/lifting.png",
      url: "https://play.google.com/store/apps/details?id=com.lifting.plus",
      sentences: [
        "Quickly calculate lifting angle & distance",
        "Find material weight with simple formulas",
        "Helpful for crane and lifting operations",
        "Save time on site with instant results"
      ]
    },
    {
      title: "Salary+",
      image: "https://cdn.jsdelivr.net/gh/selvarajpannir-spec/onsite@main/images/salary.png",
      url: "https://play.google.com/store/apps/details?id=com.salaryplus.app",
      sentences: [
        "Time card management made simple",
        "Calculate salary, overtime & allowances",
        "Designed for daily wage workers",
        "Fast and accurate every time"
      ]
    },
    {
      title: "Docs+",
      image: "https://cdn.jsdelivr.net/gh/selvarajpannir-spec/onsite@main/images/docs+.png",
      url: "https://play.google.com/store/apps/details?id=com.docs.plus",
      sentences: [
        "Generate 50 documents in under a minute",
        "Create salary invoices & certificates easily",
        "Works with your existing templates",
        "Save hours of repetitive work"
      ]
    }
  ];

  const colors = ["#1a73e8", "#d93025", "#188038", "#f9ab00", "#a142f4"];
  let appIndex = 0;
  let sentenceIndex = 0;

  function showContent() {
    const app = apps[appIndex];
    const color = colors[appIndex % colors.length];

    document.getElementById("header").style.background = color;
    document.getElementById("icon").src = app.image;
    document.getElementById("title").innerText = app.title;
    document.getElementById("title").style.color = color;
    document.getElementById("subtitle").innerText = app.sentences[sentenceIndex];
    document.getElementById("subtitle").style.color = color;
    document.getElementById("cta").href = app.url;
    document.getElementById("cta").style.background = color;
  }

  setInterval(() => {
    sentenceIndex++;
    if (sentenceIndex >= 4) {
      sentenceIndex = 0;
      appIndex = (appIndex + 1) % apps.length;
    }
    showContent();
  }, 5000);

  showContent();
</script>
</body>
</html>
